name: DeathSystem
version: '${version}'
main: dev.anonhu.deathsystem.DeathSystemPlugin
api-version: '1.21'
author: Anonhu
description: Advanced downed-state death system for Minecraft servers
website: https://github.com/Anonhu/DeathSystem

softdepend:
  - PlaceholderAPI

commands:
  deathsystem:
    description: DeathSystem management
    aliases:
      - ds
    usage: /<command> [reload]
    permission: deathsystem.admin

permissions:
  deathsystem.admin:
    description: Access to /ds reload and admin tools
    default: op
  deathsystem.bypass:
    description: Bypass downed state — instant respawn without penalty
    default: false
