# ╔══════════════════════════════════════╗
# ║        DeathSystem config.yml        ║
# ║            Version 1.0.0             ║
# ╚══════════════════════════════════════╝

downed-state:
  # Максимальное время ожидания помощи (секунды)
  max-wait-seconds: 60
  # Потеря HP в секунду в покое
  bleed-rate-idle: 0.5
  # Потеря HP в секунду при ползании
  bleed-rate-crawling: 1.5
  # Скорость ползания (0.15 = 15% от нормальной)
  crawl-speed-modifier: 0.15

revival:
  # Радиус для подъёма (блоки)
  radius-blocks: 2
  # Удержание SNEAK для самоподъёма (секунды)
  surrender-hold-seconds: 3
  enchanted-apple:
    hp-percent: 50
    channel-seconds: 5
  healing-potion:
    hp-percent: 20
    channel-seconds: 5
  bandage:
    hp-percent: 5
    channel-seconds: 3
  defibrillator:
    hp-percent: 30
    channel-seconds: 0     # 0 = мгновенно

debuffs-after-revival:
  self-revive:
    weakness-level: 2      # WEAKNESS II
    slowness-level: 1      # SLOWNESS I
    duration-seconds: 60
  ally-revive:
    weakness-level: 1      # WEAKNESS I
    duration-seconds: 30

chat-distortion:
  enabled: true
  # Каждые N символов — вставка случайного символа
  distort-every-n-chars: 4

announcements:
  # Радиус оповещения о падении (блоки)
  local-radius-blocks: 50
  # Маркер на dynmap (требует плагин dynmap)
  dynmap-marker: false

custom-items:
  bandage:
    custom-model-data: 1001
  defibrillator:
    custom-model-data: 1002
    max-uses: 3
